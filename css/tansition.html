<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            height:100px;
            width: 100px;
            background: pink;
        transition-property:width,height,background;
        transition-duration: 2s,3s;
        transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
        /* transition-delay: 2s; */
        }
        /* #box:hover{
            height:300px;
            width:400px;
            background:orange;
        } */
        #box:active{
            height:300px;
            width:400px;
            background:orange;
        }

    </style>
</head>
<body>
    <h1>CSS transition</h1>
<div id="box"></div>
</body>
</html>
