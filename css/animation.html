<style>
  .card{
    height:200px;
    width:200px;
    position: absolute;
    background:green;
    
 animation-name:sample;
 animation-duration: 5s;
 animation-iteration-count: 3;

}

    from{border-radius:0%;}
    to{border-radius:50%;}

}
</style>
