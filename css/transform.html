<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        width:200px;
        height:200px;
        background:thistle ;

    }
    #box{
        width:200px;
        height:200px;
        background:brown;
     

    }
    #box:hover{
        transition: cubic-bezier(0.075, 0.82, 0.165, 1);
        transition-duration: 2s;
        transform:perspective(300px) rotateX(60deg)  translatex(150px) ;
    }
    .container2{
        width:200px;
        height:200px;
        background:thistle ;

    }
    #box2{
        width:200px;
        height:200px;
        background:brown;
        border: 2px solid black;
    }
    #box2:hover{
        transition: cubic-bezier(0.075, 0.82, 0.165, 1);
        transition-duration: 2s;
        transform:perspective(300px)   rotateY(60deg) translatez(150px) scalez(5);
    }
</style>

<body>
    <div class=container>
        <div id=box>
            Lorem ipsum dolor sit amet.
        </div>
    </div>
    <div class=container2>
        <div id=box2>
            Lorem ipsum dolor sit amet.
        </div>
    </div>
    
</body>
</html>
