<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function myFunction(){
            document.getElementById("demo").innerHTML="Paragraph Changed!";
        }
    </script>

    <p id="demo">A Paragraph</p>
    <button type="button" onclick="myFunction()">Try it</button> 
    <button onclick="window.print()">Print this page</button>  // print button
    <script>
        document.write(5 + 6);      //write 11
        window.alert(5 + 6);       //alert message 11
        alert(5 + 6);            //alert message 11
        console.log(5 + 6);      //write 11 in console
    </script>
</body>
</html>
